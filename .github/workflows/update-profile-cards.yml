name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: stats
          core_version: 2.1.5
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&theme=transparent"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: top-langs
          core_version: 2.1.5
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=transparent"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Refresh Trophy cards
        shell: bash
        run: |
          set -euo pipefail

          fetch_trophy() {
            local theme="$1"
            local output="$2"
            local query="username=${GITHUB_REPOSITORY_OWNER}&theme=${theme}&row=1&column=7&margin-w=12&no-bg=true&no-frame=true"
            local mirrors=(
              "https://trophy.ryglcloud.net/"
              "https://trophy.benkou.dev/"
            )

            for mirror in "${mirrors[@]}"; do
              if curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
                "${mirror}?${query}" --output "${output}" \
                && grep -q '<svg' "${output}" \
                && ! grep -Eiq 'DEPLOYMENT_|Payment required|Something went wrong' "${output}"; then
                return 0
              fi
            done

            echo "Unable to refresh ${output} from the upstream-listed Trophy mirrors." >&2
            return 1
          }

          fetch_trophy flat profile/trophy-light.svg
          fetch_trophy gitdimmed profile/trophy-dark.svg

      - name: Commit changed cards
        shell: bash
        run: |
          if git diff --quiet -- profile; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards"
          git push
